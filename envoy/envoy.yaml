admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
  - name: agent_egress_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: agent_egress
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: agent_egress_vhost
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: upstream_service
                  timeout: 10s
          http_filters:
          # -------------------------------------------------------------
          # 1. Envoy External Authorization Filter (FastAPI + OPA)
          # -------------------------------------------------------------
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              http_service:
                server_uri:
                  uri: http://auth_service:8000/v1/auth/check
                  cluster: auth_service
                  timeout: 2.0s
                path_prefix: /v1/auth/check
                authorization_request:
                  allowed_headers:
                    patterns:
                    - exact: "x-agent-id"
                    - exact: "x-tenant-id"
                    - exact: "x-tool-name"
                    - exact: "x-model-name"
                    - exact: "authorization"
                    - exact: "content-type"
                authorization_response:
                  allowed_upstream_headers:
                    patterns:
                    - prefix: "x-authenticated-"
                    - prefix: "x-guardrail-"
                    - exact: "x-auth-reason"
                  allowed_client_headers:
                    patterns:
                    - prefix: "x-auth-"
                    - prefix: "x-guardrail-"
              # Buffer up to 8KB for Guardrail & OPA evaluation
              with_request_body:
                max_request_bytes: 8192
                pack_as_bytes: false
                allow_partial_message: false
              # Fail-closed security posture: If Auth service is down, drop egress
              failure_mode_allow: false

          # -------------------------------------------------------------
          # 2. Standard Router Filter
          # -------------------------------------------------------------
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Upstream FastAPI + OPA Authorization & Guardrail Service
  - name: auth_service
    connect_timeout: 0.50s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: auth_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: auth_service
                port_value: 8000

  # Upstream Platform & External Services (LLM, MCP Tools)
  - name: upstream_service
    connect_timeout: 0.50s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: upstream_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: upstream_service
                port_value: 8080
