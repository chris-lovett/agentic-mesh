# ===========================================================================
# HashiCorp Consul 2.1 Enterprise on OpenShift (ROSA 4.22)
# Configured for OpenShift Service Mesh, Agentic Fabric & non-root SCCs
# ===========================================================================

global:
  name: consul
  datacenter: dc1
  installK8sNetworkingCRDs: false
  image: "docker.io/hashicorp/consul-enterprise:2.1.0-ent"
  imageK8S: "docker.io/hashicorp/consul-k8s-control-plane:2.1.0"
  imageConsulDataplane: "docker.io/hashicorp/consul-dataplane:2.1.0"
  enterpriseLicense:
    secretName: consul-ent-license
    secretKey: key

  # OpenShift SecurityContext: Must allow OpenShift assigned UIDs / anyuid
  openshift:
    enabled: true

  # Enable full TLS encryption across the mesh
  tls:
    enabled: true
    enableAutoEncrypt: true

  # Enable Access Control Lists (ACLs)
  acls:
    manageSystemACLs: true

  # Enable Metrics / OpenTelemetry for AI token tracking
  metrics:
    enabled: true
    enableAgentMetrics: true

# ---------------------------------------------------------------------------
# Server Control Plane (1 replica for fast 2-node ROSA worker topology)
# ---------------------------------------------------------------------------
server:
  replicas: 1
  bootstrapExpect: 1
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  storage: "10Gi"
  storageClass: "gp3-csi" # AWS EBS CSI storage class on ROSA

# ---------------------------------------------------------------------------
# Consul Connect Service Mesh (Envoy sidecar injector)
# ---------------------------------------------------------------------------
connectInject:
  enabled: true
  transparentProxy:
    defaultEnabled: true
  apiGateway:
    manageExternalCRDs: false
    manageNonStandardCRDs: false

  # Default resource sizing for injected Envoy proxies
  sidecarProxy:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "250m"

# ---------------------------------------------------------------------------
# Consul UI
# ---------------------------------------------------------------------------
ui:
  enabled: true
  service:
    type: ClusterIP

# ---------------------------------------------------------------------------
# Consul Controller (CRD Reconciliation for ServiceDefaults, ServiceRoute)
# ---------------------------------------------------------------------------
controller:
  enabled: true

# ---------------------------------------------------------------------------
# OpenShift DNS integration
# ---------------------------------------------------------------------------
dns:
  enabled: true

ai:
  enabled: false
