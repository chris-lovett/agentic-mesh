{{- if .Values.upstreamService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-mesh-authz.fullname" . }}-upstream
  labels:
    {{- include "agent-mesh-authz.labels" . | nindent 4 }}
    app: {{ .Values.upstreamService.name }}
spec:
  replicas: {{ .Values.upstreamService.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.upstreamService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.upstreamService.name }}
      annotations:
        {{- if .Values.upstreamService.consul.inject }}
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/connect-service: "{{ .Values.upstreamService.consul.serviceName }}"
        consul.hashicorp.com/connect-service-port: "{{ .Values.upstreamService.service.port }}"
        {{- end }}
    spec:
      containers:
        - name: upstream-platform
          image: "{{ .Values.upstreamService.image.repository }}:{{ .Values.upstreamService.image.tag }}"
          imagePullPolicy: {{ .Values.upstreamService.image.pullPolicy }}
          command:
            - "sh"
            - "-c"
            - "pip install fastapi uvicorn[standard] pydantic && uvicorn app.upstream_main:app --host 0.0.0.0 --port 8080"
          ports:
            - name: http
              containerPort: {{ .Values.upstreamService.service.port }}
              protocol: TCP
          volumeMounts:
            - name: app-code
              mountPath: /app
          resources:
            {{- toYaml .Values.upstreamService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: app-code
          configMap:
            name: {{ include "agent-mesh-authz.fullname" . }}-code
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.upstreamService.name }}
  labels:
    {{- include "agent-mesh-authz.labels" . | nindent 4 }}
    app: {{ .Values.upstreamService.name }}
spec:
  type: {{ .Values.upstreamService.service.type }}
  ports:
    - port: {{ .Values.upstreamService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.upstreamService.name }}
{{- end }}
