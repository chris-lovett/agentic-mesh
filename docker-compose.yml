services:
  # ---------------------------------------------------------------------------
  # STACK A: Consul 2.0.x Baseline (Envoy ext_authz + FastAPI Guardrails + OPA)
  # ---------------------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:latest
    container_name: poc-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies/policy.rego"
    volumes:
      - ./auth_service/policies:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - agent-mesh

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: poc-auth-service
    environment:
      - OPA_URL=http://opa:8181/v1/data/bofa/agent/authz
    ports:
      - "8000:8000"
    depends_on:
      - opa
    networks:
      - agent-mesh

  upstream_service:
    build:
      context: .
      dockerfile: upstream_service/Dockerfile
    container_name: poc-upstream-service
    ports:
      - "8080:8080"
    networks:
      - agent-mesh

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: poc-envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "10000:10000"
      - "9901:9901"
    depends_on:
      - auth_service
      - upstream_service
    networks:
      - agent-mesh

  # ---------------------------------------------------------------------------
  # STACK B: Consul 2.1 Agentic Runtime Fabric (Native Gateway + Auto Credentials)
  # ---------------------------------------------------------------------------
  agentic_providers:
    build:
      context: .
      dockerfile: agentic_fabric/providers/Dockerfile
    container_name: poc-agentic-providers
    ports:
      - "8085:8085"
    networks:
      - agent-mesh

  envoy_agentic_gateway:
    image: envoyproxy/envoy:v1.31-latest
    container_name: poc-agentic-gateway
    volumes:
      - ./agentic_fabric/envoy/envoy-agentic.yaml:/etc/envoy/envoy-agentic.yaml:ro
    command: ["-c", "/etc/envoy/envoy-agentic.yaml", "--log-level", "info"]
    ports:
      - "10001:10001"
      - "9902:9902"
    depends_on:
      - agentic_providers
    networks:
      - agent-mesh

networks:
  agent-mesh:
    driver: bridge
