admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9902

static_resources:
  listeners:
  - name: agentic_gateway_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10001
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: agentic_fabric
          codec_type: AUTO
          route_config:
            name: agentic_routes
            virtual_hosts:
            - name: agentic_vhost
              domains: ["*"]
              routes:
              # ---------------------------------------------------------
              # Route 1: Unified LLM Ingress with Dynamic Provider Routing
              # Maps /v1/chat/completions -> OpenAI upstream with Secret Injection
              # ---------------------------------------------------------
              - match:
                  prefix: "/v1/chat/completions"
                route:
                  cluster: openai_provider
                  prefix_rewrite: "/openai/v1/chat/completions"
                  timeout: 15s
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset"
                    num_retries: 2
                request_headers_to_add:
                  # Native Proxy-Layer Credential Injection (Backed by Vault in Prod)
                  - header:
                      key: "Authorization"
                      value: "Bearer sk-proj-consul-agentic-vault-managed-key-99281"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - header:
                      key: "x-consul-mesh-tier"
                      value: "agentic-runtime-fabric-2.1"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD

              # ---------------------------------------------------------
              # Route 2: Anthropic Fallback / Direct Provider Route
              # ---------------------------------------------------------
              - match:
                  prefix: "/v1/messages"
                route:
                  cluster: openai_provider
                  prefix_rewrite: "/anthropic/v1/messages"
                  timeout: 15s
                request_headers_to_add:
                  - header:
                      key: "Authorization"
                      value: "Bearer ant-api-consul-agentic-key-10293"
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD

              # ---------------------------------------------------------
              # Route 3: Native MCP Tool Discovery & Routing
              # ---------------------------------------------------------
              - match:
                  prefix: "/mcp/internal-db"
                route:
                  cluster: openai_provider
                  prefix_rewrite: "/mcp/internal-db"
                  timeout: 10s

          http_filters:
          # -------------------------------------------------------------
          # 1. Native Consul/Envoy Token Bucket & Request Rate Limiting
          # Replaces custom FastAPI Python rate limiting!
          # -------------------------------------------------------------
          - name: envoy.filters.http.local_ratelimit
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
              stat_prefix: agentic_tpm_rpm_limiter
              token_bucket:
                max_tokens: 50
                tokens_per_fill: 50
                fill_interval: 1s
              filter_enabled:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - header:
                    key: "x-ratelimit-enforced-by"
                    value: "consul-2.1-agentic-mesh"
                  append_action: OVERWRITE_IF_EXISTS_OR_ADD

          # -------------------------------------------------------------
          # 2. Router Filter
          # -------------------------------------------------------------
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Provider Cluster (OpenAI / Anthropic / MCP Tool Mock)
  - name: openai_provider
    connect_timeout: 0.50s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: openai_provider
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: agentic_providers
                port_value: 8085
